name: Manual DB Baseline

on:
  workflow_dispatch:
    inputs:
      confirm_production_baseline:
        description: "Type BASELINE_PRODUCTION_DB to confirm the one-time production baseline run."
        required: true
        type: string
      baseline_migration:
        description: "Historical migration boundary to mark as applied (inclusive), or auto-detect highest verifiable boundary."
        required: true
        type: choice
        default: auto_detect_highest_existing
        options:
          - auto_detect_highest_existing
          - 20260525000000_initial_cadreos_core
          - 20260525153000_entry_system
          - 20260526004640_arc19a_operational_entry_architecture
          - 20260526014000_arc19d_operational_graph
          - 20260526020000_arc19e_workflow_orchestration
          - 20260526024000_arc19f_notifications_activity

permissions:
  contents: read

jobs:
  baseline-database:
    runs-on: ubuntu-latest
    env:
      # Use direct connection for Prisma migrations (avoid pooled runtime endpoint).
      DATABASE_URL: ${{ secrets.MIGRATE_DATABASE_URL || secrets.DATABASE_URL }}
      BASELINE_MIGRATIONS: |
        20260525000000_initial_cadreos_core
        20260525153000_entry_system
        20260526004640_arc19a_operational_entry_architecture
        20260526014000_arc19d_operational_graph
        20260526020000_arc19e_workflow_orchestration
        20260526024000_arc19f_notifications_activity
      PROTECTED_MIGRATIONS: |
        20260526143000_add_person_lifecycle_status
        20260526152000_add_gearops_core_tables

    steps:
      - name: Confirm one-time baseline intent
        run: |
          if [ "${{ inputs.confirm_production_baseline }}" != "BASELINE_PRODUCTION_DB" ]; then
            echo "Refusing to run without explicit baseline confirmation."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Diagnostic DB identity (safe)
        run: |
          node -e "const raw = process.env.DATABASE_URL || ''; let provider = 'unknown'; let host = 'unparseable'; try { const parsed = new URL(raw); provider = (parsed.protocol || '').replace(':', '') || 'unknown'; host = parsed.hostname || 'unparseable'; } catch {} console.log('Database provider:', provider); console.log('Database host:', host); if (host.includes('-pooler.')) { console.error('Refusing baseline with pooled host. Configure MIGRATE_DATABASE_URL to direct Neon host.'); process.exit(1); }"

      - name: Prisma migration status before baseline (diagnostic)
        run: npx prisma migrate status || true

      - name: Select baseline boundary and resolve list
        run: |
          selected_input="${{ inputs.baseline_migration }}"
          echo "Selected baseline input: $selected_input"
          printf "SELECTED_BASELINE_INPUT=%s\n" "$selected_input" >> "$GITHUB_ENV"

          if [ "$selected_input" != "auto_detect_highest_existing" ] && ! grep -Fxq "$selected_input" <<< "$BASELINE_MIGRATIONS"; then
            echo "Selected baseline migration is not in allowed historical migration list."
            exit 1
          fi

      - name: Inspect current production schema inventory (safe)
        run: |
          npx prisma db pull --print --schema prisma/schema.prisma > /tmp/live-db-schema.prisma
          if [ "${SELECTED_BASELINE_INPUT}" = "auto_detect_highest_existing" ]; then
            node scripts/db-schema-inventory.mjs --live /tmp/live-db-schema.prisma --target prisma/schema.prisma --format json > /tmp/db-schema-inventory.json
          else
            node scripts/db-schema-inventory.mjs --live /tmp/live-db-schema.prisma --target prisma/schema.prisma --selected "${SELECTED_BASELINE_INPUT}" --format json > /tmp/db-schema-inventory.json
          fi
          node scripts/db-schema-inventory.mjs --live /tmp/live-db-schema.prisma --target prisma/schema.prisma

      - name: Resolve baseline decision from live inventory
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const inventory = JSON.parse(fs.readFileSync("/tmp/db-schema-inventory.json", "utf8"));
          const selectedInput = process.env.SELECTED_BASELINE_INPUT;
          const protectedMigrations = (process.env.PROTECTED_MIGRATIONS || "")
            .split("\n")
            .map((v) => v.trim())
            .filter(Boolean);

          const eligible = inventory.baselineEligibleMigrations || [];
          let selected = selectedInput;
          let resolveList = [];

          if (selectedInput === "auto_detect_highest_existing") {
            if (eligible.length === 0) {
              console.error("No historical baseline migration markers were found in the live DB.");
              console.error("Decision: do not baseline. This database must be migrated (or receive compatibility migrations) instead of baseline-resolved.");
              console.error(`Next recommended action: ${inventory.nextRecommendedAction}`);
              process.exit(1);
            }
            selected = eligible[eligible.length - 1];
            resolveList = [...eligible];
          } else {
            if (!eligible.includes(selectedInput)) {
              const blocked = (inventory.baselineStates || []).find((s) => !s.ok);
              console.error(`Refusing to baseline through ${selectedInput} because required live markers are missing.`);
              if (blocked) {
                console.error(`First blocked migration: ${blocked.migration}`);
                if (blocked.missing?.length) {
                  console.error(`Missing markers: ${blocked.missing.join(", ")}`);
                }
              }
              console.error(`Next recommended action: ${inventory.nextRecommendedAction}`);
              process.exit(1);
            }
            resolveList = eligible.slice(0, eligible.indexOf(selectedInput) + 1);
          }

          const protectedInResolve = resolveList.filter((m) => protectedMigrations.includes(m));
          if (protectedInResolve.length > 0) {
            console.error(`Refusing to baseline protected migrations: ${protectedInResolve.join(", ")}`);
            process.exit(1);
          }

          const envFile = process.env.GITHUB_ENV;
          fs.appendFileSync(envFile, `SELECTED_BASELINE=${selected}\n`);
          fs.appendFileSync(envFile, `BASELINE_RESOLVE_LIST<<EOF\n${resolveList.join("\n")}\nEOF\n`);
          console.log(`Resolved baseline boundary: ${selected}`);
          console.log("Baseline migrations to resolve (inclusive):");
          for (const migration of resolveList) {
            console.log(`- ${migration}`);
          }
          console.log(`Classification: ${inventory.classification}`);
          console.log(`Next recommended action: ${inventory.nextRecommendedAction}`);
          NODE

      - name: Mark selected historical migrations as applied
        run: |
          while IFS= read -r migration; do
            if [ -z "$migration" ]; then
              continue
            fi

            echo "Resolving migration as applied: $migration"
            npx prisma migrate resolve --applied "$migration"
          done <<< "$BASELINE_RESOLVE_LIST"

      - name: Prisma migration status after baseline (diagnostic)
        run: npx prisma migrate status || true

      - name: Confirm protected post-baseline migrations remain pending
        run: |
          status_output="$(npx prisma migrate status 2>&1 || true)"
          echo "$status_output"
          while IFS= read -r migration; do
            if [ -z "$migration" ]; then
              continue
            fi
            if echo "$status_output" | grep -Fq "$migration"; then
              echo "✅ Still pending (as expected): $migration"
            else
              echo "ℹ️ Not pending: $migration (it may already be applied, resolved, or schema-matched from a prior run)"
            fi
          done <<< "$PROTECTED_MIGRATIONS"
