name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Prisma validate
        run: npx prisma validate
        env:
          DATABASE_URL: postgresql://cadreos:cadreos@localhost:5432/cadreos


      - name: Migration FK validation
        run: node scripts/validate-migration-fks.mjs