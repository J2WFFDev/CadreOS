name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Determine release bump
        id: release
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            if (!context.ref.startsWith("refs/heads/")) {
              core.setOutput("skip", "true");
              core.setOutput("reason", `Unsupported ref for release flow: ${context.ref}`);
              return;
            }

            const branch = context.ref.replace(/^refs\/heads\//, "");
            const headCommit = await github.rest.repos.getBranch({ owner, repo, branch });
            const commitMessage = context.payload.head_commit?.message || "";

            if (headCommit.data.commit.sha !== context.sha) {
              core.setOutput("skip", "true");
              core.setOutput("reason", "Branch head moved after this run started.");
              return;
            }

            if (commitMessage.startsWith("chore(release): v")) {
              core.setOutput("skip", "true");
              core.setOutput("reason", "Release commit detected.");
              return;
            }

            let bump = "patch";
            const associatedPulls = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner,
              repo,
              commit_sha: context.sha,
            });
            const mergedPullRequest = associatedPulls.data.find((pr) => pr.merged_at);
            const labels = (mergedPullRequest?.labels ?? [])
              .map((label) => (typeof label === "string" ? label : label.name))
              .filter(Boolean)
              .map((label) => label.toLowerCase());
            const combinedText = [mergedPullRequest?.title, commitMessage].filter(Boolean).join("\n");
            const featurePrefixPattern = /(^|\n)feat(\([^)]+\))?:/i;
            const featureWordPattern = /\bfeature\b/i;
            const breakingChangePattern = /BREAKING CHANGE|^[a-z]+(\([^)]+\))?!:/im;

            if (labels.some((label) => ["release:major", "semver:major", "major"].includes(label))) {
              bump = "major";
            } else if (labels.some((label) => ["release:minor", "semver:minor", "minor"].includes(label))) {
              bump = "minor";
            } else if (labels.some((label) => ["release:patch", "semver:patch", "patch"].includes(label))) {
              bump = "patch";
            } else if (breakingChangePattern.test(combinedText)) {
              bump = "major";
            } else if (featurePrefixPattern.test(combinedText) || featureWordPattern.test(mergedPullRequest?.title || "")) {
              bump = "minor";
            }

            core.setOutput("skip", "false");
            core.setOutput("bump", bump);
            core.setOutput("labels", labels.join(", "));

      - name: Stop when release should be skipped
        if: steps.release.outputs.skip == 'true'
        run: echo "${{ steps.release.outputs.reason }}"

      - name: Compute next version
        if: steps.release.outputs.skip != 'true'
        id: version
        run: |
          # Execute inline Node.js to validate package.json semver and emit GitHub Actions outputs.
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require("node:fs");
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const version = typeof pkg.version === "string" ? pkg.version : "";
          const match = version.match(/^(\d+)\.(\d+)\.(\d+)(?:[-+].*)?$/);
          if (!match) {
            throw new Error(`package.json version must be semver-like, received: ${version || "<missing>"}`);
          }

          const [, majorText, minorText, patchText] = match;
          const major = Number(majorText);
          const minor = Number(minorText);
          const patch = Number(patchText);
          const bump = process.env.BUMP;
          let nextVersion = `${major}.${minor}.${patch + 1}`;

          if (bump === "minor") {
            nextVersion = `${major}.${minor + 1}.0`;
          } else if (bump === "major") {
            nextVersion = `${major + 1}.0.0`;
          }

          console.log(`version=${nextVersion}`);
          console.log(`tag=v${nextVersion}`);
          NODE
        env:
          BUMP: ${{ steps.release.outputs.bump }}

      - name: Update package versions
        if: steps.release.outputs.skip != 'true'
        run: npm version "${NEXT_VERSION}" --no-git-tag-version
        env:
          NEXT_VERSION: ${{ steps.version.outputs.version }}

      - name: Commit and tag release
        if: steps.release.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(release): ${NEXT_TAG}"
          git tag "${NEXT_TAG}"
          git push origin HEAD:main --follow-tags
        env:
          NEXT_TAG: ${{ steps.version.outputs.tag }}

      - name: Create GitHub release
        if: steps.release.outputs.skip != 'true'
        uses: actions/github-script@v7
        env:
          NEXT_TAG: ${{ steps.version.outputs.tag }}
          NEXT_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_LABELS: ${{ steps.release.outputs.labels }}
        with:
          script: |
            const { owner, repo } = context.repo;
            await github.rest.repos.createRelease({
              owner,
              repo,
              tag_name: process.env.NEXT_TAG,
              name: process.env.NEXT_TAG,
              target_commitish: "main",
              generate_release_notes: true,
              body: process.env.RELEASE_LABELS
                ? `Automated ${process.env.NEXT_VERSION} release.\n\nRelease labels: ${process.env.RELEASE_LABELS}`
                : `Automated ${process.env.NEXT_VERSION} release.`,
            });
