name: Manual DB Setup

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup-database:
    runs-on: ubuntu-latest
    env:
      # Use the same runtime connection Vercel uses in production.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Install postgresql-client
        run: sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Diagnostic migration DB identity (safe)
        run: |
          node -e "const raw = process.env.DATABASE_URL || ''; let provider = 'unknown'; let host = 'unparseable'; try { const parsed = new URL(raw); provider = (parsed.protocol || '').replace(':', '') || 'unknown'; host = parsed.hostname || 'unparseable'; } catch {} console.log('Database provider:', provider); console.log('Database host:', host); console.log('Using runtime DATABASE_URL for setup/migrate path.');"

      - name: Prisma migration status (diagnostic)
        run: npx prisma migrate status || true

      - name: Resolve failed arc20g migration if stuck
        run: |
          failed_migration="20260526180000_arc20g_event_gear_planning"
          if ! echo "${failed_migration}" | grep -Eq '^[A-Za-z0-9_]+$'; then
            echo "Unexpected characters in migration name: ${failed_migration}" >&2
            exit 1
          fi
          failed_count=$(psql "$DATABASE_URL" -tAc \
            -v migration="${failed_migration}" \
            "SELECT COUNT(*) FROM _prisma_migrations WHERE migration_name = :'migration' AND finished_at IS NULL AND rolled_back_at IS NULL" \
            2>/dev/null | tr -d '[:space:]' || echo "0")
          if [ "${failed_count:-0}" -gt "0" ]; then
            echo "Found failed (un-finished) migration ${failed_migration} — resolving as rolled-back before deploy."
            npx prisma migrate resolve --rolled-back "${failed_migration}"
          else
            echo "No failed un-finished entry for ${failed_migration} — no action needed."
          fi

      - name: Apply pending Prisma migrations (post-baseline)
        run: |
          max_attempts=3
          attempt=1
          until [ "$attempt" -gt "$max_attempts" ]; do
            echo "Prisma migrate deploy attempt $attempt/$max_attempts"
            if npx prisma migrate deploy; then
              exit 0
            fi
            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "Prisma migrate deploy failed after $max_attempts attempts."
              exit 1
            fi
            echo "Retrying Prisma migrate deploy in 10 seconds..."
            sleep 10
            attempt=$((attempt + 1))
          done

      - name: Prisma migration status after deploy (diagnostic)
        run: npx prisma migrate status || true

      - name: Verify GearOps readiness schema exists
        run: |
          node - <<'NODE'
          const { PrismaClient } = require("@prisma/client");

          const prisma = new PrismaClient();
          const requiredTables = [
            "GearCategory",
            "GearCategoryField",
            "InventoryLocation",
            "GearItem",
            "GearAssignment",
            "GearCheckout",
            "GearReservation",
            "GearMaintenanceLog",
            "GearInspectionRecord",
            "ConsumableTransaction",
            "EventGearPlan",
            "EventGearRequirement",
            "EventGearAssignment",
            "EventGearRequirementTemplate",
            "GearOpsOrganizationSettings",
            "InventoryKit",
            "InventoryKitItem",
            "GearKitInspection",
            "GearKitCustodyEvent",
            "InventoryAudit",
            "InventoryAuditSession",
            "InventoryAuditCheckpoint",
            "InventoryAuditResult",
            "InventoryAuditDiscrepancy",
          ];
          const requiredColumns = [
            { table: "Program", columns: ["organizationId", "name"] },
            {
              table: "GearCategory",
              columns: [
                "description",
                "templateSlug",
                "behaviorType",
                "custodyMode",
                "requiresReturnInspection",
                "requiresMaintenanceTracking",
                "maintenanceFrequency",
                "maintenanceIntervalDays",
                "primaryIdentifierType",
                "supportsConsumableTracking",
                "consumableLowStockDefault",
                "supportsEventDeployment",
                "reportGroup",
                "reportLabel",
                "isKitContainer",
                "guardianApprovalRequired",
              ],
            },
            {
              table: "GearItem",
              columns: ["inspectionDueStatus", "maintenanceDueStatus", "nextInspectionDueAt", "nextMaintenanceDueAt"],
            },
            {
              table: "GearReservation",
              columns: ["windowStartAt", "windowEndAt", "conflictSummary", "reservedForPersonId", "reservedForTeamId", "reservedForEventId"],
            },
            { table: "EventGearPlan", columns: ["eventId"] },
            { table: "EventGearRequirement", columns: ["planId", "quantityNeeded"] },
            { table: "EventGearAssignment", columns: ["requirementId", "gearItemId", "stagedAt", "recoveredAt"] },
            {
              table: "EventGearRequirementTemplate",
              columns: ["description", "gearCategoryId", "label", "requirementType", "quantityNeeded", "isActive"],
            },
            {
              table: "GearOpsOrganizationSettings",
              columns: [
                "defaultCustodyMode",
                "enableGuardianApproval",
                "enableConsumableTracking",
                "enableEventDeployment",
                "enableReadinessTracking",
                "enableMaintenanceTracking",
                "defaultReportGroup",
              ],
            },
            {
              table: "InventoryKit",
              columns: ["description", "ownerPersonId", "assignedToPersonId", "readinessLabel", "custodyStatus", "lastInspectionStatus", "isActive"],
            },
            { table: "InventoryKitItem", columns: ["kitId", "removedAt"] },
            {
              table: "InventoryAudit",
              columns: ["description", "auditType", "scope", "nextScheduledAt", "lastExecutedAt", "archivedAt"],
            },
            { table: "InventoryAuditSession", columns: ["inventoryAuditId", "status", "startedAt", "completedAt"] },
          ];

          async function main() {
            const rows = await prisma.$queryRawUnsafe(`
              SELECT table_name
              FROM information_schema.tables
              WHERE table_schema = 'public'
                AND table_name = ANY($1::text[])
            `, requiredTables);
            const existing = new Set(rows.map((row) => row.table_name));
            const missing = requiredTables.filter((tableName) => !existing.has(tableName));

            if (missing.length > 0) {
              throw new Error(`Missing required GearOps tables after setup: ${missing.join(", ")}`);
            }

            for (const requirement of requiredColumns) {
              const columnRows = await prisma.$queryRawUnsafe(
                `
                  SELECT column_name
                  FROM information_schema.columns
                  WHERE table_schema = 'public'
                    AND table_name = $1
                    AND column_name = ANY($2::text[])
                `,
                requirement.table,
                requirement.columns,
              );
              const existingColumns = new Set(columnRows.map((row) => row.column_name));
              const missingColumns = requirement.columns.filter((columnName) => !existingColumns.has(columnName));
              if (missingColumns.length > 0) {
                throw new Error(`Missing required GearOps columns after setup for ${requirement.table}: ${missingColumns.join(", ")}`);
              }
            }

            console.log("Verified required GearOps tables:", requiredTables.join(", "));
            console.log("Verified required GearOps readiness columns.");
          }

          main()
            .then(async () => {
              await prisma.$disconnect();
            })
            .catch(async (error) => {
              console.error(error);
              await prisma.$disconnect();
              process.exit(1);
            });
          NODE

      - name: Run idempotent seed
        run: npm run prisma:seed
