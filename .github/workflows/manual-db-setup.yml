name: Manual DB Setup

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup-database:
    runs-on: ubuntu-latest
    env:
      # Must match Vercel Production DATABASE_URL value.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Diagnostic DB identity (safe)
        run: |
          node -e "const raw = process.env.DATABASE_URL || ''; let provider = 'unknown'; let host = 'unparseable'; try { const parsed = new URL(raw); provider = (parsed.protocol || '').replace(':', '') || 'unknown'; host = parsed.hostname || 'unparseable'; } catch {} console.log('Database provider:', provider); console.log('Database host:', host);"

      - name: Prisma migration status (diagnostic)
        run: npx prisma migrate status || true

      - name: Apply pending Prisma migrations (post-baseline)
        run: npx prisma migrate deploy

      - name: Run idempotent seed
        run: npm run prisma:seed
