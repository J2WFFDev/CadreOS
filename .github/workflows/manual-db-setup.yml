name: Manual DB Setup

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup-database:
    runs-on: ubuntu-latest
    env:
      # Keep the app/runtime connection unchanged.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Install postgresql-client
        run: sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Diagnostic migration DB identity (safe)
        env:
          DATABASE_URL: ${{ secrets.MIGRATE_DATABASE_URL || secrets.DATABASE_URL }}
        run: |
          node -e "const raw = process.env.DATABASE_URL || ''; let provider = 'unknown'; let host = 'unparseable'; try { const parsed = new URL(raw); provider = (parsed.protocol || '').replace(':', '') || 'unknown'; host = parsed.hostname || 'unparseable'; } catch {} console.log('Database provider:', provider); console.log('Database host:', host); if (host.includes('-pooler.')) { console.error('Refusing migrate deploy with pooled host. Configure MIGRATE_DATABASE_URL to direct Neon host.'); process.exit(1); }"

      - name: Prisma migration status (diagnostic)
        env:
          DATABASE_URL: ${{ secrets.MIGRATE_DATABASE_URL || secrets.DATABASE_URL }}
        run: npx prisma migrate status || true

      - name: Resolve failed arc20g migration if stuck
        env:
          DATABASE_URL: ${{ secrets.MIGRATE_DATABASE_URL || secrets.DATABASE_URL }}
        run: |
          failed_migration="20260526180000_arc20g_event_gear_planning"
          if ! echo "${failed_migration}" | grep -Eq '^[A-Za-z0-9_]+$'; then
            echo "Unexpected characters in migration name: ${failed_migration}" >&2
            exit 1
          fi
          failed_count=$(psql "$DATABASE_URL" -tAc \
            -v migration="${failed_migration}" \
            "SELECT COUNT(*) FROM _prisma_migrations WHERE migration_name = :'migration' AND finished_at IS NULL AND rolled_back_at IS NULL" \
            2>/dev/null | tr -d '[:space:]' || echo "0")
          if [ "${failed_count:-0}" -gt "0" ]; then
            echo "Found failed (un-finished) migration ${failed_migration} — resolving as rolled-back before deploy."
            npx prisma migrate resolve --rolled-back "${failed_migration}"
          else
            echo "No failed un-finished entry for ${failed_migration} — no action needed."
          fi

      - name: Apply pending Prisma migrations (post-baseline)
        env:
          DATABASE_URL: ${{ secrets.MIGRATE_DATABASE_URL || secrets.DATABASE_URL }}
        run: |
          max_attempts=3
          attempt=1
          until [ "$attempt" -gt "$max_attempts" ]; do
            echo "Prisma migrate deploy attempt $attempt/$max_attempts"
            if npx prisma migrate deploy; then
              exit 0
            fi
            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "Prisma migrate deploy failed after $max_attempts attempts."
              exit 1
            fi
            echo "Retrying Prisma migrate deploy in 10 seconds..."
            sleep 10
            attempt=$((attempt + 1))
          done

      - name: Prisma migration status after deploy (diagnostic)
        env:
          DATABASE_URL: ${{ secrets.MIGRATE_DATABASE_URL || secrets.DATABASE_URL }}
        run: npx prisma migrate status || true

      - name: Run idempotent seed
        run: npm run prisma:seed
